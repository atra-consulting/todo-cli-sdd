# Automatische Dependency-Updates via Dependabot (Vorbild: atra-academy).
#
# Ein Ökosystem, drei Projekte:
#   - npm: wöchentlich für todo-cli-gsd, todo-cli-kiro und todo-cli-speckit.
#     Minor-/Patch-Bumps gebündelt in EINEM Sammel-PR je Verzeichnis,
#     Sicherheitsupdates ebenfalls gebündelt, Majors einzeln.
#   - github-actions: entfällt, das Repo hat keine Workflows.
#
# Achtung: Es gibt keine CI. Vor dem Merge eines Dependabot-PRs im betroffenen
# Unterprojekt lokal `npm ci && npm run build && npm test` ausführen
# (todo-cli-gsd hat keine Tests, dort `npm run typecheck && npm run build`).
#
# Warum `cooldown`: Das häufigste npm-Angriffsmuster ist ein gekapertes
#   Maintainer-Konto, das eine bösartige NEUE Version publiziert. Solche
#   Versionen fallen meist binnen Stunden bis Tagen auf und werden entfernt.
#   Mit Cooldown erscheinen sie nie als PR. Gilt nur für Versions-Updates,
#   Security-Updates (aus Dependabot Alerts) kommen weiterhin sofort.
version: 2
updates:
  - package-ecosystem: 'npm'
    directories:
      - '/todo-cli-gsd'
      - '/todo-cli-kiro'
      - '/todo-cli-speckit'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-patch-days: 5
      semver-minor-days: 7
      semver-major-days: 14
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    ignore:
      # @types/node beschreibt die API der Laufzeit (README: Node.js >= 20).
      # Typen eines neueren Majors lassen Aufrufe durch den Typecheck, die es
      # zur Laufzeit nicht gibt. Den Major hebt, wer die Laufzeit hebt.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      minor-und-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
      # Alle Sicherheitsupdates eines Verzeichnisses als ein Sammel-PR.
      sicherheit:
        applies-to: security-updates
        patterns:
          - '*'
      # Majors außerhalb der Gruppen bekommen je einen eigenen PR.
